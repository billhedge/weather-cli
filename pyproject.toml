[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weathercli"
version = "0.1.0"
description = "Command-line weather forecast lookup powered by the free Open-Meteo API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31",
    "requests-cache>=1.2"
]

[project.scripts]
weather = "weathercli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.0",
    "mypy>=1.11",
    "types-requests>=2.31"
]

[project.urls]
Repository = "https://github.com/billhedge/weather-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/weathercli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax,
# B: bugbear (likely bugs), SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
